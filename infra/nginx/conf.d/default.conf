# Nginx is reached locally by cloudflared. Cloudflare supplies
# CF-Connecting-IP and X-Forwarded-Proto for proxied visitor requests.
# Replace X-Forwarded-For with one canonical client IP so Express does not
# mistake the local cloudflared/Nginx hop for the visitor.
map $http_cf_connecting_ip $trusted_client_ip {
    default $http_cf_connecting_ip;
    ""      $remote_addr;
}

# cloudflared connects to this origin over HTTP, even when the visitor used
# HTTPS at Cloudflare. Preserve Cloudflare's original scheme for Express.
map $http_x_forwarded_proto $visitor_scheme {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80 default_server;
    server_name _;

    location = /health {
        access_log off;
        default_type text/plain;
        return 200 "CODECOVE NGINX OK\n";
    }

    # Block backend source and private directories.
    location = /server {
        return 404;
    }

    location ^~ /server/ {
        return 404;
    }

    location = /infra {
        return 404;
    }

    location ^~ /infra/ {
        return 404;
    }

    # Block hidden files and directories (.env, .git, etc.).
    location ~ (^|/)\.(?!vite(?:/|$)) {
        return 404;
    }

    # Block common sensitive file extensions.
    location ~* \.(env|pem|key|p12|pfx|sql|bak|backup|log)$ {
        return 404;
    }

    # Forward normal application requests to the Vite development server.
    location / {
        proxy_pass http://host.docker.internal:3221;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $trusted_client_ip;
        proxy_set_header X-Forwarded-For $trusted_client_ip;
        proxy_set_header X-Forwarded-Proto $visitor_scheme;
        proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;
        proxy_set_header X-Forwarded-Host $host;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }
}
