
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80 default_server;
    server_name _;

    location = /health {
        access_log off;
        default_type text/plain;
        return 200 "CODECOVE NGINX OK\n";
    }

    # Block backend source and private directories
    location = /server {
        return 404;
    }

    location ^~ /server/ {
        return 404;
    }

    location = /infra {
        return 404;
    }

    location ^~ /infra/ {
        return 404;
    }

    # Block hidden files and directories (.env, .git, etc.)
    location ~ (^|/)\.(?!vite(?:/|$)) {
        return 404;
    }

    # Block common sensitive file extensions
    location ~* \.(env|pem|key|p12|pfx|sql|bak|backup|log)$ {
        return 404;
    }

    # Forward normal application requests to Vite
    location / {
        proxy_pass http://host.docker.internal:3221;

        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }
}
